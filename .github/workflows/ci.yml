name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU-only torch
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install app deps
        run: pip install -r requirements.txt
      - name: Install pytest
        run: pip install pytest
      - name: Run tests (downloads yolo11n.pt ~6MB on first run)
        run: pytest tests/ -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: image-organizer-ai:test
      - name: Smoke test the container
        run: |
          docker run -d --name ioa -p 5055:5000 image-organizer-ai:test
          for i in $(seq 1 30); do
            sleep 5
            if curl -sf http://localhost:5055/api/models > /dev/null; then
              echo "API is up"; break
            fi
          done
          curl -sf http://localhost:5055/api/models
          curl -sf http://localhost:5055/ -o /dev/null
          docker stop ioa
          echo "container smoke test passed"
